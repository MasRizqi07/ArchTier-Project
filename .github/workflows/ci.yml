name: ArchTier CI / CD Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://archtier_ci:ci_pass@localhost:5432/archtier_test?sslmode=disable"
      DIRECT_URL: "postgresql://archtier_ci:ci_pass@localhost:5432/archtier_test?sslmode=disable"
      BETTER_AUTH_SECRET: "ci-test-better-auth-secret-32-chars-long-minimum"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Next.js Production Build
        run: npm run build
